<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debate Arena — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10142A; --panel:#191F3D; --line:#2B3260; --gold:#D9A441;
    --ink:#ECEDF4; --ink-muted:#8B90B0;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; padding: 24px 20px 60px; max-width: 640px; margin-inline: auto;
  }
  h1 { font-family:'Fraunces',serif; font-size: 26px; margin-bottom: 4px; }
  .sub { color: var(--ink-muted); font-size: 14px; margin-bottom: 28px; }
  label { display:block; font-size: 13px; color: var(--ink-muted); margin: 16px 0 6px; }
  input, select {
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--ink); font-family:'Inter',sans-serif; font-size:15px;
  }
  button {
    margin-top: 22px; width:100%; background:var(--gold); color:#1A1206; border:none;
    border-radius:10px; padding:14px; font-weight:700; font-size:15px; cursor:pointer;
  }
  .section { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); }
  .item {
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .item .title { font-size:14px; }
  .item .meta { font-size:12px; color:var(--ink-muted); margin-top:2px; }
  .item button { margin:0; width:auto; padding:8px 14px; font-size:13px; }
  .item .reject { background:var(--line); color:var(--ink); }
  .status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status.ok { color: #6FCF97; }
  .status.err { color: #E27878; }
</style>
</head>
<body>

  <h1>Debate Arena — Admin</h1>
  <p class="sub">Add topics directly, or review what users have suggested.</p>

  <label>Backend URL</label>
  <input id="backend-url" placeholder="https://debate-arena-backend-4bk2.onrender.com" value="https://debate-arena-backend-4bk2.onrender.com">

  <label>Your Telegram ID (used as "added by")</label>
  <input id="admin-id" placeholder="e.g. 123456789">

  <div class="section">
    <h2 style="font-family:'Fraunces',serif; font-size:18px; margin:0 0 4px;">Add a topic</h2>
    <label>Topic (English)</label>
    <input id="title-en" placeholder="Should plastic bags be banned in the city?">
    <label>State</label>
    <input id="topic-state" placeholder="e.g. Maharashtra">
    <label>District (leave blank for state-wide)</label>
    <input id="topic-district" placeholder="e.g. Pune">
    <button onclick="addTopic()">Add Topic (auto-approved)</button>
    <div id="add-status" class="status"></div>
  </div>

  <div class="section">
    <h2 style="font-family:'Fraunces',serif; font-size:18px; margin:0 0 4px;">Pending suggestions</h2>
    <label>State to review</label>
    <input id="review-state" placeholder="e.g. Maharashtra">
    <button onclick="loadPending()" style="background:var(--panel-raised, #212850); color:var(--ink);">Load pending</button>
    <div id="pending-list" style="margin-top:16px;"></div>
  </div>

<script>
  function backendUrl() { return document.getElementById('backend-url').value.replace(/\/$/, ''); }

  async function addTopic() {
    const statusEl = document.getElementById('add-status');
    const body = {
      title_en: document.getElementById('title-en').value.trim(),
      state: document.getElementById('topic-state').value.trim(),
      district: document.getElementById('topic-district').value.trim() || null,
      created_by: parseInt(document.getElementById('admin-id').value) || 0,
    };
    if (!body.title_en || !body.state) {
      statusEl.textContent = "Topic and state are required.";
      statusEl.className = "status err";
      return;
    }
    try {
      const res = await fetch(`${backendUrl()}/topics?is_admin=true`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error();
      statusEl.textContent = "Topic added and live.";
      statusEl.className = "status ok";
      document.getElementById('title-en').value = '';
    } catch (e) {
      statusEl.textContent = "Failed to add — check the backend URL and try again.";
      statusEl.className = "status err";
    }
  }

  async function loadPending() {
    const state = document.getElementById('review-state').value.trim();
    const listEl = document.getElementById('pending-list');
    if (!state) { listEl.innerHTML = '<p style="color:var(--ink-muted); font-size:13px;">Enter a state first.</p>'; return; }
    listEl.innerHTML = '<p style="color:var(--ink-muted); font-size:13px;">Loading…</p>';
    try {
      const res = await fetch(`${backendUrl()}/topics?state=${encodeURIComponent(state)}&status=pending`);
      const topics = await res.json();
      if (!topics.length) {
        listEl.innerHTML = '<p style="color:var(--ink-muted); font-size:13px;">No pending suggestions.</p>';
        return;
      }
      listEl.innerHTML = '';
      topics.forEach(t => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div>
            <div class="title">${t.title_en}</div>
            <div class="meta">${t.district || t.state + ' (state-wide)'}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button onclick="review('${t.id}', true)">Approve</button>
            <button class="reject" onclick="review('${t.id}', false)">Reject</button>
          </div>`;
        listEl.appendChild(div);
      });
    } catch (e) {
      listEl.innerHTML = '<p style="color:#E27878; font-size:13px;">Failed to load.</p>';
    }
  }

  async function review(topicId, approve) {
    try {
      await fetch(`${backendUrl()}/topics/${topicId}/review`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approve }),
      });
      loadPending();
    } catch (e) {
      alert("Failed — try again.");
    }
  }
</script>
</body>
</html>
