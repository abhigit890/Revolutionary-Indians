<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Debate Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10142A;
    --panel: #191F3D;
    --panel-raised: #212850;
    --line: #2B3260;
    --gold: #D9A441;
    --gold-dim: #8A6E30;
    --ink: #ECEDF4;
    --ink-muted: #8B90B0;
    --pro: #3E8E7E;
    --con: #B2503F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(217,164,65,0.10), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(62,142,126,0.08), transparent 40%);
  }

  .screen {
    display: none;
    flex-direction: column;
    flex: 1;
    padding: 28px 20px 20px;
    animation: rise 0.35s ease;
  }
  .screen.active { display: flex; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.18;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 26px;
    max-width: 34ch;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .search svg { flex-shrink: 0; opacity: 0.55; }
  .search input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    width: 100%;
  }
  .search input::placeholder { color: var(--ink-muted); }

  .list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    flex: 1;
    margin: 0 -20px;
    padding: 0 20px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    color: var(--ink);
  }
  .row:active { background: var(--panel-raised); }
  .row .chev { color: var(--gold-dim); font-size: 18px; }
  .row.empty {
    color: var(--ink-muted);
    justify-content: center;
    font-size: 14px;
    padding: 30px 0;
    border-bottom: none;
  }

  .crumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 14px;
    color: var(--ink-muted);
  }
  .crumb button {
    background: none;
    border: none;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .confirm-panel {
    margin-top: auto;
    padding-top: 20px;
  }
  .picked {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .picked .label { font-size: 12px; color: var(--ink-muted); margin-bottom: 3px; }
  .picked .value { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }

  .cta {
    width: 100%;
    background: var(--gold);
    color: #1A1206;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .cta:disabled {
    background: var(--panel-raised);
    color: var(--ink-muted);
  }

  .dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 18px;
  }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line);
  }
  .dots span.on { background: var(--gold); }
</style>
</head>
<body>

  <!-- Screen 1: State selection -->
  <div class="screen active" id="screen-state">
    <div class="eyebrow">कदम 1 / 2</div>
    <h1>आप कहाँ से<br>बहस करेंगे?</h1>
    <p class="sub">अपना राज्य चुनें — आपको वहाँ के मुद्दों पर होने वाली बहसें दिखेंगी।</p>

    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="state-search" placeholder="राज्य खोजें...">
    </div>

    <div class="list" id="state-list"></div>
    <div class="dots"><span class="on"></span><span></span></div>
  </div>

  <!-- Screen 2: City selection -->
  <div class="screen" id="screen-city">
    <div class="crumb">
      <button id="back-to-state">← वापस</button>
    </div>
    <div class="eyebrow">कदम 2 / 2</div>
    <h1 id="city-heading">अपना शहर चुनें</h1>
    <p class="sub">आपके शहर से जुड़े मुद्दों पर बनी बहसें प्राथमिकता में दिखेंगी।</p>

    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="city-search" placeholder="शहर खोजें...">
    </div>

    <div class="list" id="city-list"></div>

    <div class="confirm-panel">
      <div class="picked" id="picked-summary" style="display:none;">
        <div class="label">आपकी लोकेशन</div>
        <div class="value" id="picked-value"></div>
      </div>
      <button class="cta" id="continue-btn" disabled>जारी रखें</button>
    </div>
    <div class="dots"><span></span><span class="on"></span></div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // Starter dataset — extend freely. Keys are state names, values are city arrays.
  const STATE_CITY_DATA = {
    "दिल्ली": ["नई दिल्ली", "द्वारका", "रोहिणी", "साकेत"],
    "महाराष्ट्र": ["मुंबई", "पुणे", "नागपुर", "नाशिक"],
    "उत्तर प्रदेश": ["लखनऊ", "कानपुर", "वाराणसी", "नोएडा", "आगरा"],
    "कर्नाटक": ["बेंगलुरु", "मैसूर", "हुबली"],
    "तमिलनाडु": ["चेन्नई", "कोयंबटूर", "मदुरई"],
    "पश्चिम बंगाल": ["कोलकाता", "हावड़ा", "सिलीगुड़ी"],
    "राजस्थान": ["जयपुर", "जोधपुर", "उदयपुर"],
    "गुजरात": ["अहमदाबाद", "सूरत", "वडोदरा"],
    "मध्य प्रदेश": ["भोपाल", "इंदौर", "ग्वालियर"],
    "बिहार": ["पटना", "गया", "मुजफ्फरपुर"],
    "तेलंगाना": ["हैदराबाद", "वारंगल"],
    "पंजाब": ["चंडीगढ़", "लुधियाना", "अमृतसर"]
  };

  let selectedState = null;
  let selectedCity = null;

  const stateListEl = document.getElementById('state-list');
  const cityListEl = document.getElementById('city-list');
  const cityHeading = document.getElementById('city-heading');
  const stateSearch = document.getElementById('state-search');
  const citySearch = document.getElementById('city-search');
  const continueBtn = document.getElementById('continue-btn');
  const pickedSummary = document.getElementById('picked-summary');
  const pickedValue = document.getElementById('picked-value');

  function renderStates(filter = '') {
    const names = Object.keys(STATE_CITY_DATA).filter(s => s.includes(filter));
    stateListEl.innerHTML = '';
    if (names.length === 0) {
      stateListEl.innerHTML = '<div class="row empty">कोई राज्य नहीं मिला</div>';
      return;
    }
    names.forEach(name => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span>${name}</span><span class="chev">›</span>`;
      row.onclick = () => selectState(name);
      stateListEl.appendChild(row);
    });
  }

  function renderCities(filter = '') {
    const cities = (STATE_CITY_DATA[selectedState] || []).filter(c => c.includes(filter));
    cityListEl.innerHTML = '';
    if (cities.length === 0) {
      cityListEl.innerHTML = '<div class="row empty">कोई शहर नहीं मिला</div>';
      return;
    }
    cities.forEach(name => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span>${name}</span><span class="chev">${selectedCity === name ? '✓' : '›'}</span>`;
      row.onclick = () => selectCity(name);
      cityListEl.appendChild(row);
    });
  }

  function selectState(name) {
    selectedState = name;
    selectedCity = null;
    cityHeading.textContent = `${name} में कहाँ?`;
    citySearch.value = '';
    renderCities();
    goToScreen('screen-city');
  }

  function selectCity(name) {
    selectedCity = name;
    renderCities(citySearch.value);
    pickedValue.textContent = `${selectedCity}, ${selectedState}`;
    pickedSummary.style.display = 'block';
    continueBtn.disabled = false;
  }

  function goToScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  stateSearch.addEventListener('input', e => renderStates(e.target.value));
  citySearch.addEventListener('input', e => renderCities(e.target.value));
  document.getElementById('back-to-state').onclick = () => goToScreen('screen-state');

  continueBtn.onclick = () => {
    // This is where we send the selection to your backend.
    const payload = { state: selectedState, city: selectedCity };
    console.log('Selected:', payload);

    if (tg) {
      // Sends data back to your bot (handled in Step 4/5 backend)
      tg.sendData(JSON.stringify(payload));
    } else {
      alert('चुना गया: ' + payload.city + ', ' + payload.state);
    }
  };

  renderStates();
</script>
</body>
</html>
